name: Verify UIS TOTP login
on:
  push:
    branches: [codex/uis-totp-login]
    paths: [.github/workflows/verify-uis-totp.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pycryptodome
      - name: Verify iCourse login and authenticated API access
        env:
          StuId: ${{ secrets.STUID }}
          UISPsw: ${{ secrets.UISPSW }}
          UIS_TOTP_SECRET: ${{ secrets.UIS_TOTP_SECRET }}
        run: |
          python -u - <<'PY'
          from src.api.icourse import ICourseClient
          from src.api.webvpn import WebVPNSession, SecondFactorError
          import time
          for attempt in range(3):
              vpn = WebVPNSession()
              try:
                  vpn.login()
                  vpn.authenticate_icourse()
                  if not ICourseClient(vpn).check_alive():
                      raise RuntimeError("iCourse user API did not confirm the session")
              except SecondFactorError:
                  raise
              except Exception as exc:
                  print(f"Login probe attempt {attempt+1}: {type(exc).__name__}")
                  if attempt == 2:
                      raise SystemExit("Authenticated iCourse API access could not be verified") from None
                  time.sleep(5)
              else:
                  print("Authenticated iCourse API access verified")
                  break
          PY

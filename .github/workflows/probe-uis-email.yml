name: Probe UIS email authentication
on:
  push:
    branches: [codex/fix-icourse-login-20261110]
    paths: [.github/workflows/probe-uis-email.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pycryptodome
      - env:
          StuId: ${{ secrets.STUID }}
          UISPsw: ${{ secrets.UISPSW }}
        run: |
          python -u - <<'PY'
          from src.api.webvpn import WebVPNSession, EmailVerificationError
          vpn = WebVPNSession()
          try:
              vpn.login()
              vpn.authenticate_icourse()
          except EmailVerificationError as exc:
              print("EMAIL VERIFICATION PROBE:", exc)
              raise SystemExit(1)
          PY

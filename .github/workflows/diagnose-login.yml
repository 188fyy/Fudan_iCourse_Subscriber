name: Diagnose iCourse login
on:
  push:
    branches: [codex/fix-icourse-login-20261110]
permissions:
  contents: read
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pycryptodome
      - name: Verify university login
        env:
          StuId: ${{ secrets.STUID }}
          UISPsw: ${{ secrets.UISPSW }}
        run: |
          python - <<'PY'
          import requests
          from src.api.webvpn import WebVPNSession
          original = requests.Session.request
          def traced(self, method, url, **kwargs):
              response = original(self, method, url, **kwargs)
              if url.endswith("/"):
                  print("portal_status", response.status_code, "redirect_path", response.headers.get("Location", "").split("?")[0][:100], flush=True)
              if "authExecute" in url:
                  try:
                      data = response.json()
                      def shape(value, depth=0):
                          if depth > 3: return type(value).__name__
                          if isinstance(value, dict): return {k: shape(v, depth+1) for k,v in value.items()}
                          if isinstance(value, list): return [shape(v,depth+1) for v in value[:2]]
                          return type(value).__name__
                      print("auth_response_shape", shape(data), flush=True)
                  except ValueError:
                      print("auth_non_json", response.status_code, flush=True)
              return response
          requests.Session.request = traced
          vpn = WebVPNSession()
          vpn.login()
          vpn.authenticate_icourse()
          PY
